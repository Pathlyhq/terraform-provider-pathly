# Same checks as the release job runs before signing (test, examples,
# docs-translations), plus Go module verification and govulncheck.
# Signed releases: release-please.yml.
# Third-party actions are pinned by commit SHA (the comment gives the version).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The downloaded modules (and the setup-go cache) must match go.sum.
      - run: go mod verify
      # go.mod and go.sum are tidy: the `go mod tidy` hook of GoReleaser then
      # changes nothing at release time.
      - run: go mod tidy -diff
      # Known vulnerabilities reachable from the provider code (Go vulnerability
      # database). Pinned version, checked against the Go checksum database.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "${unformatted}" ]; then
            echo "${unformatted}"
            echo "Run gofmt -w ."
            exit 1
          fi
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -o terraform-provider-pathly .
      - run: go test ./internal/... -race -coverprofile=covprofile
      - name: Coverage must stay at 100 %
        run: |
          total=$(go tool cover -func=covprofile | awk '/^total:/ {print $3}')
          echo "Coverage: ${total}"
          [ "${total}" = "100.0%" ] || (echo "Coverage must stay at 100%." && exit 1)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider
          path: terraform-provider-pathly
          retention-days: 1

  examples:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provider
          path: /tmp/plugins
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.1
          terraform_wrapper: false
      - run: terraform fmt -check -recursive examples
      - name: terraform validate (dev_overrides)
        run: |
          chmod +x /tmp/plugins/terraform-provider-pathly
          cat > /tmp/dev.tfrc <<'TFRC'
          provider_installation {
            dev_overrides { "pathlyhq/pathly" = "/tmp/plugins" }
            direct {}
          }
          TFRC
          export TF_CLI_CONFIG_FILE=/tmp/dev.tfrc
          for dir in minimal complete import agency; do
            (cd "examples/${dir}" && terraform validate)
          done

  docs-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: translations/{fr,es} mirror docs/
        run: |
          (cd docs && find . -name '*.md' | sort) > /tmp/docs.list
          for lang in fr es; do
            (cd "translations/${lang}" && find . -name '*.md' | sort) > "/tmp/${lang}.list"
            if ! diff "/tmp/docs.list" "/tmp/${lang}.list"; then
              echo "translations/${lang} does not mirror docs/ — see the diff above."
              exit 1
            fi
            echo "translations/${lang}: complete"
          done
          test -f README.fr.md || (echo "README.fr.md missing" && exit 1)
          test -f README.es.md || (echo "README.es.md missing" && exit 1)
